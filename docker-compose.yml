services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: reserve
      POSTGRES_USER: reserve
      POSTGRES_PASSWORD: reserve
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U reserve -d reserve"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: .
    ports:
      - "8080:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/reserve
      SPRING_DATASOURCE_USERNAME: reserve
      SPRING_DATASOURCE_PASSWORD: reserve
      AUTH_HMAC_SECRET: dev-secret-change-in-production
    depends_on:
      db:
        condition: service_healthy
