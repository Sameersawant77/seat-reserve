spring.application.name=reserve

spring.jackson.property-naming-strategy=SNAKE_CASE

server.port=${PORT:8080}

spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:reserve}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:reserve}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:reserve}
spring.datasource.hikari.maximum-pool-size=${DB_POOL_SIZE:20}

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

management.endpoints.web.exposure.include=health,prometheus,info
management.endpoint.health.show-details=when_authorized
management.endpoint.health.probes.enabled=true
management.health.livenessstate.enabled=true
management.health.readinessstate.enabled=true

reserve.auth.hmac-secret=${AUTH_HMAC_SECRET:dev-secret-change-in-production}
reserve.auth.admin-user-id=${ADMIN_USER_ID:admin}
reserve.hold.default-ttl-seconds=${HOLD_TTL_SECONDS:120}
reserve.hold.default-per-user-limit=${PER_USER_LIMIT:4}
reserve.hold.sweep-interval-ms=30000

logging.pattern.level=%5p [${spring.application.name:},%X{correlationId:-}]
